<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellüberwachung</title>
  <style>
    html, body, body > div, #container, #container-uiarea {
      height: 100%;
    }
  </style>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-language="de"
    data-sap-ui-resource-roots='{ "pomonitor.purchaseorders": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"
    data-sap-ui-flexibility-services='[{ "connector": "LocalStorageConnector" }]'></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div
    data-sap-ui-component
    data-name="pomonitor.purchaseorders"
    data-id="container"
    data-settings='{ "id": "pomonitor.purchaseorders" }'
    data-handle-validation="true"></div>

</html>
